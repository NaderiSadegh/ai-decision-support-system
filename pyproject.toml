[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-decision-support-system"
version = "0.1.0"
description = "AI Operations Analyst for synthetic SaaS incident investigation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Public Portfolio Project"}
]
dependencies = [
  "fastapi>=0.110,<1.0",
  "pydantic>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.27,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pre-commit>=3.7,<5.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.6.9,<1.0"
]

[project.scripts]
ops-analyst = "app.cli:main"
ops-api = "app.api:main"
ops-generate-data = "data.generate_synthetic:main"
ops-eval = "evaluation.run_evaluation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
