name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      OPS_ANALYST_DATA_DIR: data/synthetic
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Evaluate deterministic pipeline
        run: python -m evaluation.run_evaluation --output /tmp/ai_ops_evaluation_report.md --min-score 0.75

